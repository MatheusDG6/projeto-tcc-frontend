<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <title>Cadastrar</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body style="height: 100vh; background-color: #dee2e6" class="d-flex justify-content-center align-items-center ">
        <div class="card shadow p-5 mb-7 bg-body rounded container-sm" style="max-width: 500px">
            <div class="container justify-content-center align-items-center col-5">
                <h4>CADASTRAR</h4>
                <br>
            </div>
            <form 
                th:action="@{/cadastrar}" 
                th:object="${usuario}" method="post"
                >
                
                <div class="form-floating">
                    <input type="text" th:field="*{nome}" class="form-control" id="nome" placeholder="name@example.com">
                    <label for="nome">Nome</label>
                    <label>Nome: </label>
                    <br/>
                </div>
                
                <div class="form-floating">
                    <input type="email" th:field="*{email}" class="form-control" id="floatingInput" placeholder="name@example.com">
                    <label for="floatingInput">Email</label>
                    <label>Email: </label>
                    <br/>
                </div>
                
                <div class="form-floating">
                    <input type="password" th:field="*{senha}" class="form-control" id="floatingPassword" placeholder="Password">
                    <label for="floatingPassword">Senha</label>
                    <label>Senha: </label>
                    <br/>
                </div>
                
                <div class="justify-content-center align-middle">
                    <button type="submit" class="btn btn-success w-100">Cadastrar</button>
                </div>
            </form>
        </div>
    </body>
</html>
