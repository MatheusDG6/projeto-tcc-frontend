<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <title>Cadastro Profissao</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body class="bg-light">

        <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">

            <div class="card shadow-sm border-0 w-100" style="max-width: 650px;">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <h1 class="fw-bold mb-2">
                            Cadastro de Profissão
                        </h1>

                        <p class="text-secondary mb-0">
                            Cadastre seu serviço no Hub
                        </p>

                    </div>

                    <form th:action="@{/profissao/cadastrar}" method="post">

                        <div class="mb-3">

                            <label for="profissao" class="form-label fw-semibold">
                                Profissão
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="profissao"
                                name="profissao"
                                placeholder="Ex: Eletricista"
                                required>

                        </div>

                        <div class="mb-3">

                            <label for="descricao" class="form-label fw-semibold">
                                Descrição
                            </label>

                            <textarea
                                class="form-control"
                                id="descricao"
                                name="descricao"
                                rows="4"
                                placeholder="Descreva os serviços que realiza..."
                                required></textarea>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label for="cidade" class="form-label fw-semibold">
                                    Cidade
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="cidade"
                                    name="cidade"
                                    placeholder="Ex: Londrina"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label for="telefone" class="form-label fw-semibold">
                                    Telefone
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="telefone"
                                    name="telefone"
                                    placeholder="(43) 99999-9999"
                                    required>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label for="formaPagamento" class="form-label fw-semibold">
                                Forma de pagamento
                            </label>

                            <select
                                class="form-select"
                                id="formaPagamento"
                                name="formaPagamento"
                                required>

                                <option value="" selected disabled>
                                    Selecione uma opção
                                </option>

                                <option value="PIX">PIX</option>

                                <option value="DINHEIRO">Dinheiro</option>

                                <option value="CARTAO">Cartão</option>

                                <option value="TRANSFERENCIA">Transferência</option>

                                <option value="A_COMBINAR">A combinar</option>

                            </select>

                        </div>

                        <div class="d-flex justify-content-center gap-3">

                            <a
                                href="/tela-profissoes"
                                class="btn btn-outline-secondary px-4">
                                Cancelar
                            </a>

                            <button
                                type="submit"
                                class="btn btn-dark px-4">
                                Cadastrar
                            </button>

                        </div>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
