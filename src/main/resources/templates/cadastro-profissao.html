<!DOCTYPE html>
<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <title>Cadastro Profissao</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body class="bg-white">
        <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
            <div class="card shadow-lg border-0 w-100" style="max-width: 650px; border-radius: 24px;">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold mb-2" style="color: #1a1e29;">
                            Cadastro de Profissão
                        </h2>
                        <p class="text-secondary mb-0">
                            Cadastre seu serviço no Hub
                        </p>
                    </div>
                    <form th:action="@{/profissao/cadastrar}" method="post">
                        <div class="mb-3">
                            <label for="profissao" class="form-label fw-semibold">
                                Profissão
                            </label>
                            <select
                                class="form-select border-0 py-3 px-3 text-secondary"
                                id="profissao"
                                name="profissao"
                                style="background-color: #f1f3f5; font-size: 0.95rem; border-radius: 10px;"
                                required>

                                <option value="" selected disabled>Selecione sua profissão</option>
                                <option value="Eletricista">Eletricista</option>
                                <option value="Pedreiro">Pedreiro</option>
                                <option value="Jardineiro">Jardineiro</option>
                                <option value="Técnico de Ar-Condicionado">Técnico de Ar-Condicionado</option>
                                <option value="Pintor">Pintor</option>
                                <option value="Encanador">Encanador</option>
                                <option value="Gesseiro">Gesseiro</option>
                                <option value="Outros Serviços Gerais">Outros Serviços Gerais</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="descricao" class="form-label fw-semibold">
                                Descrição
                            </label>
                            <select
                                class="form-select border-0 py-3 px-3 text-secondary"
                                id="descricao"
                                name="descricao"
                                style="background-color: #f1f3f5; font-size: 0.95rem; border-radius: 10px;"
                                required>

                                <option value="" selected disabled>
                                    Selecione uma descrição
                                </option>
                                <option value="Instalação e manutenção de redes elétricas, tomadas, interruptores e iluminação.">
                                    Instalação e manutenção de redes elétricas, tomadas, interruptores e iluminação.
                                </option>
                                <option value="Construção e reforma de paredes, pisos, calçadas e estruturas em alvenaria.">
                                    Construção e reforma de paredes, pisos, calçadas e estruturas em alvenaria.
                                </option>
                                <option value="Manutenção de jardins, poda de plantas, corte de grama e cuidados com áreas verdes.">
                                    Manutenção de jardins, poda de plantas, corte de grama e cuidados com áreas verdes.
                                </option>
                                <option value="Instalação, limpeza e manutenção de aparelhos de ar-condicionado.">
                                    Instalação, limpeza e manutenção de aparelhos de ar-condicionado.
                                </option>
                                <option value="Pintura residencial e comercial de paredes, portas, tetos e outras superfícies.">
                                    Pintura residencial e comercial de paredes, portas, tetos e outras superfícies.
                                </option>
                                <option value="Instalação e manutenção de torneiras, tubulações, vasos sanitários e sistemas hidráulicos.">
                                    Instalação e manutenção de torneiras, tubulações, vasos sanitários e sistemas hidráulicos.
                                </option>
                                <option value="Instalação e reparo de forros, paredes e acabamentos em gesso e drywall.">
                                    Instalação e reparo de forros, paredes e acabamentos em gesso e drywall.
                                </option>
                                <option value="Execução de pequenos reparos, manutenções e serviços gerais residenciais.">
                                    Execução de pequenos reparos, manutenções e serviços gerais residenciais.
                                </option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="cidade" class="form-label fw-semibold">
                                    Cidade
                                </label>
                                <input
                                    type="text"
                                    class="form-control border-0 py-3 px-3"
                                    id="cidade"
                                    name="cidade"
                                    placeholder="Ex: Londrina"
                                    style="background-color: #f1f3f5; font-size: 0.95rem; border-radius: 10px;"
                                    required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="estado" class="form-label fw-semibold">
                                    Estado
                                </label>
                                <select
                                    class="form-select border-0 py-3 px-3 text-secondary"
                                    id="estado"
                                    name="estado"
                                    style="background-color: #f1f3f5; font-size: 0.95rem; border-radius: 10px;"
                                    required>

                                    <option value="" selected disabled>
                                        Selecione o estado
                                    </option>
                                    <option value="AC">AC</option>
                                    <option value="AL">AL</option>
                                    <option value="AP">AP</option>
                                    <option value="AM">AM</option>
                                    <option value="BA">BA</option>
                                    <option value="CE">CE</option>
                                    <option value="DF">DF</option>
                                    <option value="ES">ES</option>
                                    <option value="GO">GO</option>
                                    <option value="MA">MA</option>
                                    <option value="MT">MT</option>
                                    <option value="MS">MS</option>
                                    <option value="MG">MG</option>
                                    <option value="PA">PA</option>
                                    <option value="PB">PB</option>
                                    <option value="PR">PR</option>
                                    <option value="PE">PE</option>
                                    <option value="PI">PI</option>
                                    <option value="RJ">RJ</option>
                                    <option value="RN">RN</option>
                                    <option value="RS">RS</option>
                                    <option value="RO">RO</option>
                                    <option value="RR">RR</option>
                                    <option value="SC">SC</option>
                                    <option value="SP">SP</option>
                                    <option value="SE">SE</option>
                                    <option value="TO">TO</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="telefone" class="form-label fw-semibold">
                                Telefone
                            </label>
                            <input
                                type="tel"
                                class="form-control border-0 py-3 px-3"
                                id="telefone"
                                name="telefone"
                                placeholder="(43) 99999-9999"
                                style="background-color: #f1f3f5; font-size: 0.95rem; border-radius: 10px;"
                                required>
                        </div>
                        <div class="mb-4">
                            <label for="forma_pagamento" class="form-label fw-semibold">
                                Forma de pagamento
                            </label>
                            <select
                                class="form-select border-0 py-3 px-3 text-secondary"
                                id="forma_pagamento"
                                name="forma_pagamento"
                                style="background-color: #f1f3f5; font-size: 0.95rem; border-radius: 10px;"
                                required>

                                <option value="" selected disabled>
                                    Selecione uma opção
                                </option>
                                <option value="PIX">PIX</option>
                                <option value="DINHEIRO">Dinheiro</option>
                                <option value="CARTAO">Cartão</option>
                                <option value="TRANSFERENCIA">Transferência</option>
                                <option value="A_COMBINAR">A combinar</option>
                            </select>
                        </div>
                        <div class="d-flex justify-content-center gap-3 pt-2">
                            <a
                                href="/tela-profissoes"
                                class="btn btn-dark fw-bold px-4 py-2"
                                style="border-radius: 10px;">
                                Cancelar
                            </a>

                            <button
                                type="submit"
                                class="btn btn-success fw-bold px-4 py-2"
                                style="border-radius: 10px;">
                                Cadastrar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
