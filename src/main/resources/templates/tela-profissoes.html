<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <title>Tela de Profissões</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body class="bg-light">
        <div class="container-fluid">
            <div class="row min-vh-100">
                <aside class="col-md-3 col-lg-2 bg-white border-end p-4 sticky-top vh-100">
                    <div class="mb-5">
                        <h4 class="fw-bold text-primary">
                            ProMatch Serviços
                        </h4>
                    </div>
                    <nav class="nav flex-column gap-2">
                        <a href="/tela-profissoes"
                           class="nav-link active bg-primary text-white rounded-3 p-3 fw-semibold">
                            Profissões
                        </a>

                        <a href="/meus-matches"
                           class="nav-link text-dark p-3 rounded-3">
                            Meus Matches
                        </a>

                        <a href="/matches-aceitos"
                           class="nav-link text-dark p-3 rounded-3">
                            Matches Aceitos
                        </a>
                    </nav>
                    <div class="position-absolute bottom-0 start-0 mb-4 ps-4">
                        <a href="/"
                           class="nav-link text-dark p-3">
                            &nbsp; Sair
                        </a>
                    </div>
                </aside>
                <main class="col-md-9 col-lg-10 p-4 p-lg-5">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h1 class="fw-bold text-dark mb-1">
                                Profissões
                            </h1>

                            <p class="text-secondary mb-0">
                                Encontre o profissional ideal para o que você precisa.
                            </p>
                        </div>
                        <div class="d-flex align-items-center gap-3">
                            <span class="fs-4">

                            </span>

                            <div class="text-end">


                            </div>
                            <span class="rounded-circle bg-secondary-subtle p-2">

                            </span>
                        </div>
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-lg-6">
                            <div class="input-group">
                                <span class="input-group-text bg-white">

                                </span>

                                <input
                                    type="text"
                                    class="form-control form-control-lg"
                                    placeholder="Buscar por profissão, serviço ou cidade..."
                                    >
                            </div>
                        </div>
                        <div class="col-lg-3">
                            <select class="form-select form-select-lg">
                                <option selected>
                                    Todas as cidades
                                </option>

                                <option>
                                    Londrina - PR
                                </option>

                                <option>
                                    Cambé - PR
                                </option>

                                <option>
                                    Ibiporã - PR
                                </option>

                            </select>
                        </div>
                        <div class="col-lg-3">
                            <button class="btn btn-primary btn-lg w-100">
                                Filtrar
                            </button>
                        </div>
                    </div>
                    <div th:each="profissao : ${profissoes}"
                         class="card border-0 shadow-sm rounded-4 mb-3">
                        <div class="card-body p-4">
                            <div class="row align-items-center">
                                <div class="col-lg-8">
                                    <h3 class="fw-bold mb-2"
                                        th:text="${profissao.profissao}">
                                        Nome da profissão
                                    </h3>

                                    <p class="text-secondary mb-3"
                                       th:text="${profissao.descricao}">
                                        Descrição da profissão
                                    </p>

                                    <p class="text-secondary mb-0">

                                        <span th:text="${profissao.cidade}">
                                            Londrina
                                        </span>
                                        -
                                        <span th:text="${profissao.estado}">
                                            PR
                                        </span>
                                    </p>

                                </div>
                                <div class="col-lg-4 mt-4 mt-lg-0">
                                    <p class="text-secondary">
                                        Telefone:
                                        <span th:text="${profissao.telefone}">
                                            Telefone
                                        </span>
                                    </p>

                                    <p class="text-secondary">
                                        Pagamento:
                                        <span th:text="${profissao.forma_pagamento}">
                                            PIX
                                        </span>
                                    </p>

                                    <div class="d-grid gap-2">

                                        <button class="btn btn-primary">
                                            Ver perfil
                                        </button>

                                        <a th:href="@{/solicitar-match/{id}(id=${profissao.id_profissao})}"
                                           class="btn btn-outline-primary">
                                            Match
                                        </a>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="text-center mt-4">
                        <a href="/cadastro-profissao"
                           class="btn btn-primary btn-lg px-5">
                            Cadastrar Profissão
                        </a>
                    </div>
                </main>
            </div>
        </div>
    </body>
</html>
